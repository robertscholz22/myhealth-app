# The iOS shell (P21), generated with XcodeGen (`xcodegen generate` in this directory) so the
# project stays a reviewable text file and can be edited without a Mac. The .xcodeproj is not
# committed. Version and build number are passed in by CI from app/build.gradle.kts.
name: MyHealth
options:
  bundleIdPrefix: io.github.robertscholz22
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  MyHealth:
    type: application
    platform: iOS
    sources: [MyHealth]
    dependencies:
      # The static Kotlin framework calls these; a static library does not pull them in itself.
      - sdk: HealthKit.framework
    info:
      path: MyHealth/Info.plist
      properties:
        CFBundleDisplayName: MyHealth
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Compose renders at 120 Hz on ProMotion iPhones only with this key.
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        # Apple Health (P22.1). The app only reads; the update string covers the Debug-only test
        # seeder, which writes sample data into the simulator's Health store.
        NSHealthShareUsageDescription: MyHealth reads your workouts, heart rate, steps, energy, sleep, weight and body fat from Apple Health to show your training history, estimate training load and recovery, and set daily nutrition targets. Your data stays on this iPhone.
        NSHealthUpdateUsageDescription: MyHealth never writes to Apple Health. Only test builds write sample data to check the sync.
        NSCameraUsageDescription: MyHealth uses the camera to read nutrition labels and product barcodes. Pictures stay on this iPhone.
        # "Open in MyHealth" for FIT, CSV, Garmin ZIP exports and backups (P22.2). Files are copied
        # into the app's Inbox, not edited in place.
        LSSupportsOpeningDocumentsInPlace: false
        # Background refresh (P22.4); the identifier matches IosBackground.REFRESH_TASK.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [io.github.robertscholz22.myhealth.refresh]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Activity file
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.garmin.fit, public.comma-separated-values-text, public.zip-archive, public.json]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.garmin.fit
            UTTypeDescription: Garmin FIT activity
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [fit]
    entitlements:
      path: MyHealth/MyHealth.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.robertscholz22.myhealth
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework Shared"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build the Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
  MyHealthUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MyHealthUITests]
    dependencies:
      - target: MyHealth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.robertscholz22.myhealth.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MyHealth
schemes:
  MyHealth:
    build:
      targets:
        MyHealth: all
        MyHealthUITests: [test]
    test:
      targets: [MyHealthUITests]
